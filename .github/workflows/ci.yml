name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # Dev-grade values are fine here — this only runs against an ephemeral CI
  # Mongo instance, and server/src/config/env.ts refuses these in production.
  MONGODB_URI: mongodb://127.0.0.1:27017/h_ecommerce_ci
  CLIENT_ORIGIN: http://localhost:3000
  COOKIE_DOMAIN: localhost
  JWT_ACCESS_SECRET: ci-only-access-secret-not-for-production-use
  JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-production-use
  MOCK_GATEWAY_SECRET: ci-only-mock-gateway-secret
  REVALIDATE_SECRET: ci-only-revalidate-secret

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  client:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The storefront's static pages (/, collections, PDPs) fetch product
      # data at build time — a real API has to be up for `next build` to
      # succeed, not just for local dev.
      - name: Build and start the API
        working-directory: server
        run: |
          npm ci
          npm run build
          npm run seed
          npm start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/api/health && exit 0
            sleep 1
          done
          echo "API did not become healthy in time" >&2
          exit 1

      - name: Install client deps
        working-directory: client
        run: npm ci

      - name: Lint
        working-directory: client
        run: npm run lint

      - name: Typecheck
        working-directory: client
        run: npm run typecheck

      - name: Build
        working-directory: client
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
